# Mai Budget Planer — CI
# Linse: Secrets niemals im Repo · Fast Feedback · keine Finanzdaten / kein Datenupload
name: CI

on:
  push:
    # Alle Branches: APK-Build früh validieren.
    branches: ["**"]
  pull_request:
    branches: [main]

# Nur lesen; keine Schreibrechte für Actions im CI.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  dart-packages:
    name: Backup format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        package: [packages/mai_backup_format]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter (Dart SDK)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Pub get
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test

  build-apk:
    name: Release APK
    needs: [analyze-test, dart-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ubuntu-latest liefert ANDROID_HOME bereits (Runner-Image).
      # Kein android-actions/setup-android — das scheiterte im ersten Run.
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses >/dev/null 2>&1 || true

      - name: Pub get
        run: flutter pub get

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Build release APK
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee apk-build.log; then
            {
              echo "## APK build failed"
              echo
              echo '```text'
              # Kontext um den eigentlichen Fehler (nicht nur die FAILURE-Zeile)
              if grep -n 'What went wrong:' apk-build.log >/dev/null 2>&1; then
                start=$(grep -n 'What went wrong:' apk-build.log | tail -n 1 | cut -d: -f1)
                start=$((start > 5 ? start - 5 : 1))
                sed -n "${start},$((start + 40))p" apk-build.log
              else
                tail -n 120 apk-build.log
              fi
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Annotationen: Fehlerblock, nicht die pub-outdated-Liste
            if grep -n 'What went wrong:' apk-build.log >/dev/null 2>&1; then
              start=$(grep -n 'What went wrong:' apk-build.log | tail -n 1 | cut -d: -f1)
              start=$((start > 2 ? start - 2 : 1))
              sed -n "${start},$((start + 25))p" apk-build.log
            else
              tail -n 30 apk-build.log
            fi | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr '|' '/' | cut -c1-200)
              # Leere Zeilen und reine Trenner überspringen
              case "$safe" in
                ''|'---'*|'===') continue ;;
              esac
              echo "::error::$safe"
            done
            exit 1
          fi
        env:
          # Runner-RAM schonen; Daemon in CI ausschalten
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload APK build log (failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-build-log
          path: apk-build.log
          if-no-files-found: ignore
          retention-days: 7

      # Wear-OS-App (Modul :wear); gradlew legt `flutter build apk` an.
      - name: Build Wear OS APK
        working-directory: android
        run: ./gradlew :wear:assembleRelease
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      # Datenschutz: weder Handy- noch Uhr-App dürfen INTERNET anfordern
      # (auch nicht über eine Bibliothek wie die Play-Dienste).
      - name: Check permissions
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2
          for apk in build/app/outputs/flutter-apk/app-release.apk build/wear/outputs/apk/release/wear-release.apk; do
            echo "== $apk"
            "$aapt2" dump permissions "$apk" | tee perms.txt
            if grep -q 'android.permission.INTERNET' perms.txt; then
              echo "::error::$apk fordert INTERNET an"
              exit 1
            fi
          done

      # Einheitlicher Dateiname über alle Mai-Apps
      - name: Rename APK
        if: success()
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk mai-budget-planer.apk
          cp build/wear/outputs/apk/release/wear-release.apk mai-budget-planer-wear.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mai-budget-planer.apk
          path: mai-budget-planer.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Wear OS APK artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mai-budget-planer-wear.apk
          path: mai-budget-planer-wear.apk
          if-no-files-found: error
          retention-days: 14

  # Play-Store-Bundles (AAB). Auf main mit Signing-Secrets: mit dem
  # Upload-Schlüssel signiert und als Artefakt hochgeladen. In Pull Requests:
  # Probelauf mit einem Wegwerf-Schlüssel (prüft die Signatur-Verdrahtung,
  # lädt nichts hoch). Auf main ohne Secrets: übersprungen, die APKs oben
  # bleiben wie bisher.
  release-bundle:
    name: Release AAB
    needs: [analyze-test, dart-packages]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - name: Check signing secrets
        id: signing
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
          elif [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
            && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Keine Signing-Secrets gesetzt – kein signiertes AAB (siehe README, Abschnitt Release)."
          fi

      - name: Checkout
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        if: steps.signing.outputs.enabled == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Accept Android licenses
        if: steps.signing.outputs.enabled == 'true'
        run: yes | flutter doctor --android-licenses >/dev/null 2>&1 || true

      - name: Pub get
        if: steps.signing.outputs.enabled == 'true'
        run: flutter pub get

      # Schlüssel nur im temporären Runner-Verzeichnis, nie im Checkout.
      - name: Write key.properties
        if: steps.signing.outputs.enabled == 'true'
        run: |
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          if [ "${{ steps.signing.outputs.mode }}" = "dry-run" ]; then
            # Wegwerf-Schlüssel nur für den Probelauf.
            ANDROID_KEYSTORE_PASSWORD=dryrun-password
            ANDROID_KEY_ALIAS=upload
            ANDROID_KEY_PASSWORD=dryrun-password
            keytool -genkeypair -v -keystore "$keystore" -alias upload \
              -keyalg RSA -keysize 2048 -validity 1 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
              -dname "CN=CI dry run" >/dev/null
          else
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          fi
          {
            echo "storeFile=$keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build app bundle
        if: steps.signing.outputs.enabled == 'true'
        run: flutter build appbundle --release
        env:
          REQUIRE_RELEASE_SIGNING: "true"

      - name: Build Wear OS bundle
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        run: ./gradlew :wear:bundleRelease
        env:
          REQUIRE_RELEASE_SIGNING: "true"

      # Beide Bundles müssen mit dem Schlüssel aus key.properties signiert
      # sein, nicht mit dem Debug-Key.
      - name: Verify signatures
        if: steps.signing.outputs.enabled == 'true'
        run: |
          for aab in build/app/outputs/bundle/release/app-release.aab build/wear/outputs/bundle/release/wear-release.aab; do
            echo "== $aab"
            out=$(jarsigner -verify -verbose -certs "$aab")
            echo "$out" | grep -m1 'Signed by' || true
            if ! echo "$out" | grep -q 'jar verified'; then
              echo "::error::$aab ist nicht signiert"
              exit 1
            fi
            if echo "$out" | grep -q 'CN=Android Debug'; then
              echo "::error::$aab ist mit dem Debug-Key signiert"
              exit 1
            fi
          done

      - name: Remove signing files
        if: always() && steps.signing.outputs.enabled == 'true'
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"

      - name: Rename bundles
        if: steps.signing.outputs.mode == 'release'
        run: |
          cp build/app/outputs/bundle/release/app-release.aab mai-budget-planer.aab
          cp build/wear/outputs/bundle/release/wear-release.aab mai-budget-planer-wear.aab

      - name: Upload app bundle
        if: steps.signing.outputs.mode == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mai-budget-planer.aab
          path: mai-budget-planer.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Wear OS bundle
        if: steps.signing.outputs.mode == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mai-budget-planer-wear.aab
          path: mai-budget-planer-wear.aab
          if-no-files-found: error
          retention-days: 30
