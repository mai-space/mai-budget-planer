name: mai_budget_planer
description: "Lokaler Budgetplaner — Privacy first (Mai Budget Planer)."
# Private App, nicht auf pub.dev veröffentlichen.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  drift: ^2.35.1
  drift_flutter: ^0.3.1
  sqlite3: ^3.7.0
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  # Gleiches Sicherungsformat wie Mai Doctor Hub (AES-256-GCM / PBKDF2).
  mai_backup_format:
    path: packages/mai_backup_format

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/

# Verschlüsselte Datenbank (SQLite3 Multiple Ciphers statt Standard-SQLite).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
